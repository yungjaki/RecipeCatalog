name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Изтегляне на кода
        uses: actions/checkout@v4

      - name: Инсталиране на .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Възстановяване на пакетите
        run: dotnet restore RecipeCatalog.sln

      - name: Компилиране
        run: dotnet build RecipeCatalog.sln --configuration Release --no-restore

      - name: NUnit тестове
        run: dotnet test RecipeCatalog.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Качване на резултатите от тестовете
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
